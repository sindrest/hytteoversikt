# Weekly Monday refresh of public/cabins-data.json from iNatur,
# one occupancy snapshot in public/occupancy-history.json, and magazine
# lists in public/lists-data.json. Fetches on a schedule, then opens a
# PR — never pushes the dump to main.
# fetch-lists runs after fetch-cabins. A POW/timeout there must not fail
# the cabin dump; the existing lists-data.json is kept.
#
# Schedule is UTC. 07:00 UTC Mondays is 08:00 Europe/Oslo in winter (CET)
# and 09:00 Europe/Oslo in summer (CEST).
name: Refresh cabin data

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-cabin-data
  cancel-in-progress: false

jobs:
  refresh:
    name: Fetch cabins and open PR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Snapshot previous dump
        run: cp public/cabins-data.json /tmp/cabins-data.prev.json

      - name: Fetch cabins from iNatur
        run: npm run fetch-cabins

      - name: Fetch magazine lists
        run: |
          cp public/lists-data.json /tmp/lists-data.prev.json
          cp public/lists-unmatched.json /tmp/lists-unmatched.prev.json
          if npm run fetch-lists; then
            echo "LISTS_INGEST_STATUS=ok" >> "$GITHUB_ENV"
          else
            echo "fetch-lists failed (POW/timeout?); keeping existing lists-data.json" >&2
            echo "LISTS_INGEST_STATUS=failed" >> "$GITHUB_ENV"
            cp /tmp/lists-data.prev.json public/lists-data.json
            cp /tmp/lists-unmatched.prev.json public/lists-unmatched.json
          fi

      - name: Append occupancy snapshot
        run: npm run append-occupancy

      - name: Build PR body
        id: summary
        run: |
          node scripts/cabin-refresh-summary.mjs \
            --prev /tmp/cabins-data.prev.json \
            --next public/cabins-data.json \
            --occupancy public/occupancy-history.json \
            --lists-prev /tmp/lists-data.prev.json \
            --lists-next public/lists-data.json \
            --lists-unmatched public/lists-unmatched.json \
            --lists-status "${LISTS_INGEST_STATUS:-ok}" \
            --out /tmp/cabin-refresh-pr-body.md

      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: Refresh cabin data from iNatur
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          branch: refresh-cabin-data
          delete-branch: true
          title: Refresh cabin data from iNatur
          body-path: /tmp/cabin-refresh-pr-body.md
          add-paths: |
            public/cabins-data.json
            public/occupancy-history.json
            public/lists-data.json
            public/lists-unmatched.json
