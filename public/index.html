<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>iNatur Hytteoversikt</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f0f4f0;
      color: #1a1a1a;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #2c6e49;
      color: white;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,.2);
      flex-shrink: 0;
    }
    header h1 { font-size: 1.15rem; font-weight: 700; }
    header span { font-size: 0.8rem; opacity: .8; }
    .header-stats { margin-left: auto; display: flex; gap: 8px; align-items: center; }
    .stat-badge { background: rgba(255,255,255,.2); padding: 2px 10px; border-radius: 20px; font-size: .8rem; white-space: nowrap; }
    #mobile-view-switch {
      display: none;
      margin-left: auto;
      gap: 4px;
      background: rgba(255,255,255,.16);
      border-radius: 999px;
      padding: 3px;
    }
    .mobile-view-btn {
      border: none;
      background: transparent;
      color: rgba(255,255,255,.9);
      font-size: .74rem;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 999px;
      cursor: pointer;
    }
    .mobile-view-btn.active {
      background: white;
      color: #2c6e49;
    }

    .main { display: flex; flex: 1; overflow: hidden; }

    .map-pane {
      flex: 1;
      position: relative;
      min-width: 0;
      min-height: 0;
    }

    /* SIDEBAR */
    #sidebar {
      width: 360px;
      background: white;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #ddd;
      flex-shrink: 0;
    }

    #filters {
      padding: 14px;
      background: #f8fdf9;
      border-bottom: 1px solid #e0e8e0;
    }
    #filters h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; color: #555; margin-bottom: 10px; }
    .filter-row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
    .filter-row[hidden] { display: none !important; }
    .filter-row label { font-size: .78rem; color: #555; width: 90px; flex-shrink: 0; }
    .filter-row input, .filter-row select {
      flex: 1; padding: 5px 8px; border: 1px solid #ccc; border-radius: 6px;
      font-size: .8rem; background: white;
    }
    #btn-filter {
      width: 100%; padding: 8px; background: #2c6e49; color: white;
      border: none; border-radius: 6px; cursor: pointer; font-size: .85rem;
      margin-top: 4px; font-weight: 600;
    }
    #btn-filter:hover { background: #235c3c; }
    #btn-reset {
      width: 100%; padding: 6px; background: transparent; color: #888;
      border: 1px solid #ccc; border-radius: 6px; cursor: pointer; font-size: .78rem;
      margin-top: 4px;
    }
    #btn-reset:hover { background: #f5f5f5; }

    .amenity-filters { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
    #helg-filters { margin: 2px 0 8px; }
    .amenity-chip, .helg-chip {
      font-size: .7rem; padding: 2px 8px; border-radius: 12px;
      border: 1px solid #ccc; cursor: pointer; background: white; color: #555;
      user-select: none; transition: all .15s;
    }
    .amenity-chip.active, .helg-chip.active { background: #2c6e49; color: white; border-color: #2c6e49; }

    .list-browse { margin-bottom: 12px; }
    .list-browse[hidden] { display: none !important; }
    .list-chips, .area-chips {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      padding: 0 0 4px;
      scrollbar-width: thin;
    }
    .area-chips { margin-bottom: 12px; }
    .list-chip, .area-chip {
      flex: 0 0 auto;
      max-width: 200px;
      font: inherit;
      font-size: .72rem;
      line-height: 1.25;
      padding: 5px 10px;
      border-radius: 14px;
      border: 1px solid #c5d4c8;
      background: white;
      color: #3f4f44;
      cursor: pointer;
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .list-chip.active, .area-chip.active {
      background: #2c6e49;
      color: white;
      border-color: #2c6e49;
    }
    .hearts-chip-group {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 6px;
    }
    .copy-heart-links {
      flex: 0 0 auto;
      font: inherit;
      font-size: .72rem;
      line-height: 1.25;
      padding: 5px 10px;
      border-radius: 14px;
      border: 1px solid #c5d4c8;
      background: white;
      color: #3f4f44;
      cursor: pointer;
      white-space: nowrap;
    }
    .copy-heart-links[hidden] { display: none !important; }
    .list-article {
      font-size: .74rem;
      color: #555;
      line-height: 1.35;
      margin-top: 6px;
    }
    .list-article[hidden] { display: none !important; }
    .list-article a {
      color: #2c6e49;
      font-weight: 600;
      text-decoration: none;
    }
    .list-article a:hover { text-decoration: underline; }

    #cabin-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }
    .cabin-card {
      padding: 10px 12px;
      margin-bottom: 6px;
      background: white;
      border: 1px solid #e0e8e0;
      border-radius: 8px;
      cursor: pointer;
      transition: border-color .15s, box-shadow .15s;
    }
    .cabin-card:hover, .cabin-card.active, .cabin-card.hovered {
      border-color: #2c6e49;
      box-shadow: 0 0 0 2px rgba(44,110,73,.15);
    }
    .cabin-card.sold-out { opacity: .6; }
    .cabin-card-head { display: flex; align-items: flex-start; gap: 8px; }
    .cabin-card-head h3 { flex: 1; min-width: 0; }
    .cabin-card h3 { font-size: .85rem; font-weight: 600; color: #1a1a1a; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cabin-card .cabin-location { font-size: .72rem; color: #888; margin-bottom: 4px; }
    .cabin-heart {
      flex-shrink: 0;
      margin: -2px -4px 0 0;
      padding: 4px 6px;
      border: none;
      background: transparent;
      color: #b0b8b2;
      font-size: 1rem;
      line-height: 1;
      cursor: pointer;
      border-radius: 6px;
    }
    .cabin-heart:hover { background: #f3f6f3; color: #c0392b; }
    .cabin-heart.saved { color: #c0392b; }
    .cabin-meta { display: flex; gap: 6px; flex-wrap: wrap; }
    .cabin-tag {
      font-size: .68rem; padding: 1px 7px; border-radius: 12px; background: #e8f4ed; color: #2c6e49;
    }
    .cabin-tag.price { background: #fff3e0; color: #e65100; }
    .cabin-tag.beds { background: #e3f2fd; color: #1565c0; }
    .cabin-tag.sold { background: #fde; color: #900; }
    .cabin-tag.available { background: #e8f5e9; color: #2e7d32; }
    .cabin-tag.unavailable { background: #fde; color: #900; }
    .cabin-tag.listed { background: #fff8e1; color: #8a6d00; }
    .cabin-tag.rare { background: #f3e5f5; color: #6a1b9a; }
    .cabin-tag.approx {
      background: #eef1ee;
      color: #3f4f44;
      border: 1px dashed #7a8b7f;
    }

    #date-status.loading::before {
      content: ''; display: inline-block; width: 10px; height: 10px;
      border: 2px solid #e0e8e0; border-top-color: #2c6e49; border-radius: 50%;
      animation: spin .6s linear infinite; margin-right: 6px; vertical-align: middle;
    }

    #map {
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    .map-bounds-btn {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1100;
      padding: 8px 14px;
      background: rgba(255,255,255,.96);
      border: 1px solid #d5e3d8;
      border-radius: 999px;
      box-shadow: 0 2px 10px rgba(0,0,0,.14);
      color: #2c6e49;
      font: inherit;
      font-size: .82rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
    .map-bounds-btn:hover { background: #fff; border-color: #2c6e49; }
    .map-bounds-btn.is-on {
      background: #2c6e49;
      color: white;
      border-color: #2c6e49;
    }
    .map-bounds-btn.is-on:hover { background: #235c3c; }
    .map-bounds-btn.is-hidden { display: none !important; }

    .weekend-rail {
      position: absolute;
      left: 10px;
      right: 10px;
      bottom: 10px;
      z-index: 1100;
      padding: 10px 12px 8px;
      background: rgba(255,255,255,.96);
      border: 1px solid #d5e3d8;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,.16);
    }
    .weekend-rail.is-hidden { display: none !important; }
    .weekend-rail-head {
      font-size: .72rem;
      font-weight: 700;
      color: #3f4f44;
      margin-bottom: 6px;
    }
    .weekend-rail-items {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      padding: 2px 2px 6px;
    }
    .weekend-rec {
      flex: 0 0 auto;
      width: 150px;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      border: 1px solid #d5e3d8;
      background: #fff;
      color: #1a1a1a;
      border-radius: 10px;
      padding: 0;
      overflow: hidden;
      cursor: pointer;
      font: inherit;
      font-size: .78rem;
      line-height: 1.3;
      text-align: left;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
    }
    .weekend-rec:hover, .weekend-rec.active {
      border-color: #2c6e49;
      box-shadow: 0 0 0 2px rgba(44,110,73,.15);
    }
    .weekend-rec-img {
      display: block;
      width: 100%;
      height: 90px;
      object-fit: cover;
      border-radius: 9px 9px 0 0;
    }
    .weekend-rec-meta {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 6px 8px 8px;
      min-width: 0;
    }
    .weekend-rec-name {
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .weekend-rec-dates { color: #2c6e49; font-weight: 600; }
    .weekend-rail-loading {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: .78rem;
      color: #555;
      padding: 6px 2px 8px;
    }
    .weekend-rail-spinner {
      width: 12px;
      height: 12px;
      border: 2px solid #e0e8e0;
      border-top-color: #2c6e49;
      border-radius: 50%;
      animation: spin .6s linear infinite;
      flex-shrink: 0;
    }

    .cabin-peek {
      display: none;
      position: absolute;
      left: 8px;
      right: 8px;
      bottom: 8px;
      z-index: 1100;
      gap: 10px;
      align-items: center;
      padding: 8px;
      background: rgba(255,255,255,.96);
      border: 1px solid #d5e3d8;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,.16);
    }
    .cabin-peek.is-hidden { display: none !important; }
    .cabin-peek-img {
      width: 96px;
      height: 64px;
      object-fit: cover;
      border-radius: 8px;
      flex-shrink: 0;
    }
    .cabin-peek-body { min-width: 0; flex: 1; }
    .cabin-peek-name {
      font-weight: 600;
      font-size: .85rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .cabin-peek-kommune {
      font-size: .72rem;
      color: #888;
      margin: 2px 0 6px;
    }

    .leaflet-popup-content { min-width: 220px; max-width: 300px; }
    .popup-img { width: 100%; height: 120px; object-fit: cover; border-radius: 6px; margin-bottom: 8px; }
    .popup-title { font-weight: 700; font-size: .95rem; margin-bottom: 4px; color: #2c6e49; }
    .popup-desc { font-size: .78rem; color: #555; margin-bottom: 6px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .popup-meta { font-size: .8rem; color: #444; margin-bottom: 3px; }
    .popup-amenities { display: flex; flex-wrap: wrap; gap: 3px; margin: 6px 0; }
    .popup-amenity { font-size: .65rem; padding: 1px 6px; border-radius: 10px; background: #f0f4f0; color: #555; }
    .popup-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 6px; }
    .popup-link { display: inline-block; padding: 5px 14px; background: #2c6e49; color: white; border-radius: 5px; text-decoration: none; font-size: .8rem; }
    .popup-link:hover { background: #235c3c; }
    .popup-heart {
      display: inline-block;
      padding: 5px 14px;
      border: 1px solid #2c6e49;
      border-radius: 5px;
      background: white;
      color: #2c6e49;
      font: inherit;
      font-size: .8rem;
      cursor: pointer;
    }
    .popup-heart:hover { background: #f3f8f5; }
    .popup-heart.saved {
      border-color: #c0392b;
      color: #c0392b;
      background: #fdeaea;
    }
    .popup-approx-note {
      font-size: .75rem;
      font-weight: 700;
      color: #3f4f44;
      background: #eef1ee;
      border: 1px dashed #7a8b7f;
      padding: 5px 8px;
      border-radius: 5px;
      margin-bottom: 8px;
    }
    .popup-lists { margin: 8px 0 4px; padding: 6px 8px; background: #fff8e1; border-radius: 6px; }
    .popup-lists-label { font-size: .72rem; font-weight: 700; color: #8a6d00; margin-bottom: 3px; }
    .popup-lists ul { margin: 0; padding-left: 16px; }
    .popup-lists li { font-size: .74rem; color: #5c4a00; margin-bottom: 2px; }

    .map-pin {
      width: 12px;
      height: 12px;
      border: 2px solid white;
      border-radius: 50%;
      box-shadow: 0 1px 4px rgba(0,0,0,.4);
      position: relative;
    }
    .map-pin.listed {
      box-shadow: 0 0 0 2px #e6b422, 0 1px 4px rgba(0,0,0,.45);
    }
    .leaflet-marker-icon.pin-emphasis {
      overflow: visible !important;
    }
    .map-pin.hovered, .map-pin.selected {
      transform: scale(1.35);
      box-shadow: 0 0 0 3px #fff, 0 0 0 6px #2c6e49, 0 2px 8px rgba(0,0,0,.35);
    }
    .map-pin.listed.hovered, .map-pin.listed.selected {
      box-shadow: 0 0 0 2px #e6b422, 0 0 0 6px #2c6e49, 0 2px 8px rgba(0,0,0,.35);
    }
    .map-pin.approx.hovered, .map-pin.approx.selected {
      box-shadow: 0 0 0 3px #fff, 0 0 0 6px #2c6e49, 0 1px 3px rgba(0,0,0,.22);
    }
    .map-pin.approx.listed.hovered, .map-pin.approx.listed.selected {
      box-shadow: 0 0 0 2px #e6b422, 0 0 0 6px #2c6e49, 0 1px 3px rgba(0,0,0,.22);
    }
    .map-pin-badge {
      position: absolute;
      top: -9px;
      right: -8px;
      font-size: 11px;
      line-height: 1;
      color: #e6b422;
      text-shadow: 0 0 2px #fff, 0 1px 1px rgba(0,0,0,.35);
    }
    .map-pin-heart-badge {
      position: absolute;
      top: -9px;
      left: -8px;
      font-size: 11px;
      line-height: 1;
      color: #c0392b;
      text-shadow: 0 0 2px #fff, 0 1px 1px rgba(0,0,0,.35);
    }
    .map-pin-rare-badge {
      position: absolute;
      left: 50%;
      bottom: calc(100% + 3px);
      transform: translateX(-50%);
      white-space: nowrap;
      font-size: 9px;
      font-weight: 700;
      line-height: 1.2;
      background: #6a1b9a;
      color: #fff;
      padding: 1px 5px;
      border-radius: 8px;
      box-shadow: 0 1px 3px rgba(0,0,0,.25);
      pointer-events: none;
    }
    .cabin-div-icon {
      background: transparent !important;
      border: none !important;
      overflow: visible !important;
    }
    .map-pin.approx {
      width: 16px;
      height: 16px;
      border-radius: 2px;
      background: rgba(238,241,238,.9) !important;
      border: 2px dashed #5d7263;
      box-shadow: 0 1px 3px rgba(0,0,0,.22);
    }
    .map-pin.approx.sold {
      border-color: #a05a5a;
      background: rgba(255,244,244,.88) !important;
    }
    .map-pin.approx.listed {
      box-shadow: 0 0 0 2px #e6b422, 0 1px 3px rgba(0,0,0,.22);
    }
    .map-pin-approx-mark {
      position: absolute;
      left: 50%;
      top: calc(100% + 1px);
      transform: translateX(-50%);
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0;
      line-height: 1.2;
      color: #3f4f44;
      background: #eef1ee;
      border: 1px dashed #5d7263;
      border-radius: 3px;
      padding: 0 3px;
      pointer-events: none;
      text-transform: lowercase;
      white-space: nowrap;
    }
    .map-pin.approx.sold .map-pin-approx-mark {
      color: #7a3030;
      background: #fff4f4;
      border-color: #a05a5a;
    }
    .map-pin-price {
      position: absolute;
      left: 50%;
      top: calc(100% + 2px);
      transform: translateX(-50%);
      white-space: nowrap;
      font-size: 9px;
      font-weight: 700;
      line-height: 1.2;
      background: #fff;
      color: #1f2a24;
      padding: 1px 5px;
      border-radius: 8px;
      box-shadow: 0 1px 3px rgba(0,0,0,.22);
      pointer-events: none;
    }
    .map-pin.approx .map-pin-price {
      top: calc(100% + 13px);
    }

    .no-results { padding: 20px; text-align: center; color: #888; font-size: .85rem; }

    #loading {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(255,255,255,.9); display: flex; align-items: center;
      justify-content: center; z-index: 9999; flex-direction: column; gap: 12px;
    }
    #loading .spinner { width: 40px; height: 40px; border: 4px solid #e0e8e0; border-top-color: #2c6e49; border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading p { color: #555; font-size: .9rem; }

    .marker-cluster-small { background-color: rgba(44,110,73,.3); }
    .marker-cluster-small div { background-color: rgba(44,110,73,.6); color: white; }
    .marker-cluster-medium { background-color: rgba(44,110,73,.4); }
    .marker-cluster-medium div { background-color: rgba(44,110,73,.7); color: white; }
    .marker-cluster-large { background-color: rgba(44,110,73,.5); }
    .marker-cluster-large div { background-color: rgba(44,110,73,.8); color: white; }
    .marker-cluster-has-star { overflow: visible; }
    .marker-cluster-star {
      position: absolute;
      top: -2px;
      right: -2px;
      font-size: 12px;
      line-height: 1;
      color: #e6b422;
      text-shadow: 0 0 2px #fff, 0 1px 1px rgba(0,0,0,.35);
      pointer-events: none;
    }

    /* Listed gold stars sit above numbered clusters at every zoom. */
    .leaflet-listed-pane { z-index: 620; }

    @media (max-width: 1024px) {
      #sidebar { width: 320px; }
    }

    @media (max-width: 900px) {
      header {
        padding: 10px 12px;
        gap: 8px;
        flex-wrap: wrap;
      }
      header h1 { font-size: 1rem; }
      header span { font-size: .75rem; }
      #mobile-view-switch { display: inline-flex; }
      .header-stats {
        margin-left: 0;
        width: 100%;
        order: 3;
        justify-content: flex-start;
        flex-wrap: wrap;
        gap: 6px;
      }
      .stat-badge { font-size: .72rem; }

      .main {
        display: block;
        position: relative;
        min-height: 0;
      }
      .map-pane,
      #sidebar {
        width: 100%;
        height: 100%;
      }
      #sidebar {
        border-right: 0;
        border-top: 1px solid #ddd;
      }

      body.mobile-view-map #sidebar { display: none; }
      body.mobile-view-list .map-pane { display: none; }
      body.mobile-view-list #sidebar {
        display: block;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }
      body.mobile-view-list #cabin-list {
        flex: none;
        overflow: visible;
      }

      #filters { padding: 12px; }
      #filters h2 { margin-bottom: 8px; font-size: .76rem; }
      .filter-row {
        flex-direction: column;
        align-items: stretch;
        gap: 4px;
        margin-bottom: 10px;
      }
      .filter-row label { width: auto; font-size: .75rem; }
      .filter-row input,
      .filter-row select {
        padding: 8px 10px;
        font-size: 16px;
      }
      #date-status {

function clusterChildNeedsStar(marker) {
  const id = marker._cabinId;
  if (!id) return false;

}

function createClusterIcon(cluster) {
  const childCount = cluster.getChildCount();
  let sizeClass = 'small';
  if (childCount >= 100) sizeClass = 'large';
  else if (childCount >= 10) sizeClass = 'medium';

  const needsStar = cluster.getAllChildMarkers().some(clusterChildNeedsStar);
  const html = needsStar
    ? `<div><span>${childCount}</span></div><span class="marker-cluster-star">★</span>`
    : `<div><span>${childCount}</span></div>`;
  return L.divIcon({
    html,
    className: `marker-cluster marker-cluster-${sizeClass}${needsStar ? ' marker-cluster-has-star' : ''}`,
    iconSize: [40, 40],
  });
}

  spiderfyOnMaxZoom: true,
  showCoverageOnHover: false,
  disableClusteringAtZoom: 13,

});
map.addLayer(clusterGroup);

// Listed cabins stay out of MarkerCluster so ★ pins remain visible at country zoom.

let listMapFit = false;

let allCabins = [];
let cabinLists = [];
let listsByCabinId = {};
let occupancySnapshots = [];
let rarityByCabinId = {};

let pinPricesShown = false;

const HEARTS_KEY = 'hytteoversikt-hearts';
let heartedIds = new Set();
let heartsFilterOn = false;
let selectedAreaId = '';
const AREA_CHIPS = [
  { id: 'jotunheimen', label: 'Jotunheimen', municipalities: ['Lom', 'Vågå', 'Vang', 'Skjåk'] },
  { id: 'dovrefjell', label: 'Dovrefjell', municipalities: ['Dovre', 'Lesja', 'Folldal'] },

];

const MOBILE_BREAKPOINT = 900;

const RARITY_MIN_RATE = 0.5;

const mobileViewSwitch = document.getElementById('mobile-view-switch');
const mobileViewButtons = mobileViewSwitch ? [...mobileViewSwitch.querySelectorAll('.mobile-view-btn')] : [];

function isMobileViewport() {
  return window.innerWidth <= MOBILE_BREAKPOINT;

function updateMobileViewButtons(view) {

}

  if (!mobileViewSwitch) return;

  mobileViewButtons.forEach(btn => {
    btn.addEventListener('click', () => setMobileView(btn.dataset.view));
  });

  const syncMobileLayout = () => {
    if (isMobileViewport()) {
      const activeView = document.body.classList.contains('mobile-view-list') ? 'list' : 'map';
      document.body.classList.remove('mobile-view-map', 'mobile-view-list');

      refreshMapSize();

    refreshMapSize();
    hideCabinPeek();

  window.addEventListener('resize', syncMobileLayout);
  syncMobileLayout();
}

// ──────────────── LOAD DATA ────────────────
function indexCabinLists(lists) {
  cabinLists = Array.isArray(lists) ? lists : [];
  listsByCabinId = {};
  cabinLists.forEach(list => {
    (list.cabinIds || []).forEach(id => {
      if (!listsByCabinId[id]) listsByCabinId[id] = [];
      listsByCabinId[id].push(list);
    });
  });
}

function listsForCabin(id) {
  return listsByCabinId[id] || [];
}

function indexOccupancy(history) {
  occupancySnapshots = Array.isArray(history?.snapshots) ? history.snapshots : [];
  rarityReady = occupancySnapshots.length >= RARITY_MIN_SNAPSHOTS;
  rarityByCabinId = {};
  const counts = {};
  occupancySnapshots.forEach(snapshot => {
    (snapshot.soldOutIds || []).forEach(id => {
      counts[id] = (counts[id] || 0) + 1;
    });
  });
  const n = occupancySnapshots.length;
  Object.entries(counts).forEach(([id, soldOutCount]) => {
    const rate = n ? soldOutCount / n : 0;
    rarityByCabinId[id] = {
      soldOutCount,
      snapshotCount: n,
      rate,
      rare: rarityReady && rate >= RARITY_MIN_RATE,
    };
  });
}

function rarityForCabin(id) {
  return rarityByCabinId[id] || {
    soldOutCount: 0,
    snapshotCount: occupancySnapshots.length,
    rate: 0,
    rare: false,
  };
}

function isRareCabin(id) {
  return rarityReady && rarityForCabin(id).rare;
}

function coordSourceOf(cabin) {
  if (cabin?.coordSource) return cabin.coordSource;
  return cabin?.lat && cabin?.lng ? 'exact' : 'none';
}

function isExactCabin(cabin) {
  return coordSourceOf(cabin) === 'exact';
}

function isApproxCabin(cabin) {
  const source = coordSourceOf(cabin);
  return source === 'municipality' || source === 'county';
}

function approxPopupLead(cabin) {
  const source = coordSourceOf(cabin);
  if (source === 'county') return 'Omtrentlig posisjon (fylke)';
  if (source === 'municipality') return 'Omtrentlig posisjon (kommune)';
  return '';
}

function loadHearts() {
  const known = new Set(allCabins.map(c => c.id));
  try {
    const raw = localStorage.getItem(HEARTS_KEY);
    if (!raw) {
      heartedIds = new Set();
      return;
    }
    const parsed = JSON.parse(raw);
    if (!Array.isArray(parsed)) {
      heartedIds = new Set();
      return;
    }
    heartedIds = new Set(parsed.filter(id => typeof id === 'string' && known.has(id)));
  } catch {
    heartedIds = new Set();
  }
}

function persistHearts() {
  try {
    localStorage.setItem(HEARTS_KEY, JSON.stringify([...heartedIds]));
  } catch {
    // Ignore quota / private-mode failures; the app still works.
  }
}

function isHearted(id) {
  return heartedIds.has(id);
}

function syncHeartControls(id) {
  const saved = isHearted(id);
  document.querySelectorAll(`[data-heart-id="${id}"]`).forEach(el => {
    el.classList.toggle('saved', saved);
    el.setAttribute('aria-pressed', saved ? 'true' : 'false');
    if (el.classList.contains('popup-heart')) el.textContent = saved ? 'Lagret' : 'Lagre';
    if (el.classList.contains('cabin-heart')) {
      el.textContent = saved ? '♥' : '♡';
      el.setAttribute('aria-label', saved ? 'Fjern fra Mine hytter' : 'Lagre hytte');
    }
  });
}

function toggleHeart(id) {
  if (!allCabins.some(c => c.id === id)) return;
  if (heartedIds.has(id)) heartedIds.delete(id);
  else heartedIds.add(id);
  persistHearts();
  syncCopyHeartLinksButton();

  if (heartsFilterOn) {
    refreshVisibleCabins();
    return;
  }

  const cabin = allCabins.find(c => c.id === id);
  const marker = markerMap[id];
  if (cabin && marker) {
    marker.setIcon(cabinPinIcon(cabin, pinPricesShown));
    marker.setPopupContent(cabinPopupHtml(cabin));
    clusterGroup.refreshClusters(marker);
  }
  updateList(filterCabinsByMapBounds(filterCabinsByForm()));
  syncHeartControls(id);
}

function formatDumpFetchedAt(iso) {
  if (iso == null || iso === '') return null;
  const date = new Date(iso);
  if (Number.isNaN(date.getTime())) return null;
  const formatted = new Intl.DateTimeFormat('nb-NO', {
    timeZone: 'Europe/Oslo',
    day: 'numeric',
    month: 'short',
    year: 'numeric',
    hour: '2-digit',
    minute: '2-digit',
  }).format(date);
  return `Oppdatert ${formatted}`;
}

function showDumpUpdated(iso) {

    badge.hidden = true;

async function loadData() {
  try {
    const [res, listsRes, occupancyRes] = await Promise.all([
      fetch('cabins-data.json'),
      fetch('lists-data.json').catch(() => null),
      fetch('occupancy-history.json').catch(() => null),
    ]);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    allCabins = Array.isArray(data.cabins) ? data.cabins : [];
    loadHearts();
    if (listsRes && listsRes.ok) {
      const listsData = await listsRes.json();
      indexCabinLists(listsData.lists);
    }
    if (occupancyRes && occupancyRes.ok) {
      indexOccupancy(await occupancyRes.json());
    }
    document.getElementById('cabin-count').textContent = `${allCabins.length} hytter`;
    showDumpUpdated(data.fetchedAt);
    populateFilters();
    restoreFiltersFromUrl();
    applyFilters();
    document.getElementById('loading').style.display = 'none';
    refreshMapSize();
    loadWeekendRecommendations();
  } catch (e) {
    document.getElementById('loading').innerHTML = `
      <p style="color:#c00;max-width:400px;text-align:center">
        <strong>Kunne ikke laste cabins-data.json</strong><br><br>

        Deretter start lokalt:<br>
        <code>npm run dev</code><br><br>
        <small>${e.message}</small>
      </p>`;
  }
}

// ──────────────── DATE AVAILABILITY API ────────────────
const availabilityCache = new Map();
const availabilityInflight = new Map();

async function fetchAvailableCabinIdsUncached(fromDate, toDate) {
  const fra = new Date(fromDate).getTime();
  const til = new Date(toDate).getTime();
  const filter = JSON.stringify([{felt:'type', sokeord:'hyttetilbud'}]);
  const ids = new Set();
  let page = 0;
  let totalPages = 1;

  while (page < totalPages) {
    // Fetch up to 4 pages in parallel
    const batch = [];
    const batchEnd = Math.min(page + 4, totalPages);
    for (let p = page; p < batchEnd; p++) {
      const params = new URLSearchParams({ f: filter, fra: String(fra), til: String(til), ledig: 'true', p: String(p) });
      batch.push(
        fetch(`/api/inatur/internal/search?${params}`)
          .then(r => {
            if (!r.ok) throw new Error(`HTTP ${r.status}`);
            return r.json();
          })
          .then(json => {
            totalPages = json.paginering.totaltAntallSider;
            for (const r of json.resultat) ids.add(r.id);
            return json;
          })
      );
    }
    await Promise.all(batch);
    page = batchEnd;
  }
  return ids;
}

async function fetchAvailableCabinIds(fromDate, toDate) {
  const key = `${fromDate}|${toDate}`;
  if (availabilityCache.has(key)) return availabilityCache.get(key);
  if (availabilityInflight.has(key)) return availabilityInflight.get(key);
  const pending = fetchAvailableCabinIdsUncached(fromDate, toDate)
    .then(ids => {
      availabilityCache.set(key, ids);
      return ids;
    })
    .finally(() => availabilityInflight.delete(key));
  availabilityInflight.set(key, pending);
  return pending;
}

async function fetchFlexibleWeekendCabinIds() {
  const weekends = nextWeekendRanges(WEEKEND_COUNT);
  const union = new Set();
  let succeeded = 0;
  for (let i = 0; i < weekends.length; i += WEEKEND_BATCH) {
    const batch = weekends.slice(i, i + WEEKEND_BATCH);
    const results = await Promise.all(batch.map(async weekend => {
      try {
        const ids = await fetchAvailableCabinIds(weekend.from, weekend.to);
        return ids;
      } catch (err) {
        console.warn(`Hoppet over helg ${weekend.from}–${weekend.to}:`, err);
        return null;
      }
    }));
    for (const ids of results) {
      if (!ids) continue;
      succeeded++;
      for (const id of ids) union.add(id);
    }
  }
  return { ids: union, succeeded };
}

function weekendFlexChip() {

// ──────────────── WEEKEND RECOMMENDATIONS ────────────────
const OSLO_TZ = 'Europe/Oslo';
const NO_MONTHS_SHORT = ['jan', 'feb', 'mar', 'apr', 'mai', 'jun', 'jul', 'aug', 'sep', 'okt', 'nov', 'des'];
const WEEKEND_COUNT = 12;
const WEEKEND_BATCH = 3;

function osloTodayYmd() {
  return new Intl.DateTimeFormat('en-CA', {
    timeZone: OSLO_TZ,
    year: 'numeric',
    month: '2-digit',
    day: '2-digit',
  }).format(new Date());
}

function addDaysYmd(ymd, days) {
  const [y, m, d] = ymd.split('-').map(Number);
  return new Date(Date.UTC(y, m - 1, d + days)).toISOString().slice(0, 10);
}

function weekdayUtcYmd(ymd) {
  const [y, m, d] = ymd.split('-').map(Number);
  return new Date(Date.UTC(y, m - 1, d)).getUTCDay();
}

function nextWeekendRanges(count) {
  const today = osloTodayYmd();
  const daysUntilFriday = (5 - weekdayUtcYmd(today) + 7) % 7;
  const ranges = [];
  for (let i = 0; i < count; i++) {
    const friday = addDaysYmd(today, daysUntilFriday + i * 7);
    ranges.push({ from: friday, to: addDaysYmd(friday, 2) });
  }
  return ranges;
}

function formatWeekendNo(fromYmd, toYmd) {
  const [, fm, fd] = fromYmd.split('-').map(Number);
  const [, tm, td] = toYmd.split('-').map(Number);
  if (fm === tm) return `${fd}.–${td}. ${NO_MONTHS_SHORT[fm - 1]}`;
  return `${fd}. ${NO_MONTHS_SHORT[fm - 1]}–${td}. ${NO_MONTHS_SHORT[tm - 1]}`;
}

async function loadWeekendRecommendations() {
  try {
    const starred = new Set(Object.keys(listsByCabinId));
    if (!starred.size) {
      hideWeekendRail();
      return;
    }

    setWeekendRailLoading();

    const weekends = nextWeekendRanges(WEEKEND_COUNT);
    const cabinsById = new Map(allCabins.map(c => [c.id, c]));
    const soonest = new Map();

    const recsFromSoonest = () => [...soonest.values()].sort((a, b) => {
      if (a.from !== b.from) return a.from < b.from ? -1 : 1;
      return a.cabin.name.localeCompare(b.cabin.name, 'no');
    });

    for (let i = 0; i < weekends.length; i += WEEKEND_BATCH) {
      const batch = weekends.slice(i, i + WEEKEND_BATCH);
      const results = await Promise.all(batch.map(async weekend => {
        try {
          const ids = await fetchAvailableCabinIds(weekend.from, weekend.to);
          return { from: weekend.from, to: weekend.to, ids };
        } catch (err) {
          console.warn(`Hoppet over helg ${weekend.from}–${weekend.to}:`, err);
          return null;
        }
      }));
      for (const result of results) {
        if (!result) continue;
        for (const id of result.ids) {
          if (!starred.has(id) || soonest.has(id)) continue;
          const cabin = cabinsById.get(id);
          if (!cabin) continue;
          soonest.set(id, { cabin, from: result.from, to: result.to });
        }
      }
      if (soonest.size) renderWeekendRail(recsFromSoonest());
    }

    if (!soonest.size) hideWeekendRail();
  } catch (err) {
    console.warn('Anbefalte helger feilet:', err);
    if (!document.querySelector('.weekend-rec')) hideWeekendRail();
  }
}

function listsNewestFirst() {
  return cabinLists
    .map((list, index) => ({ list, index }))
    .sort((a, b) => {
      const aAt = a.list.publishedAt;
      const bAt = b.list.publishedAt;
      if (aAt && bAt && aAt !== bAt) return aAt < bAt ? 1 : -1;
      if (aAt && !bAt) return -1;
      if (!aAt && bAt) return 1;
      return a.index - b.index;
    })
    .map(entry => entry.list);
}

// ──────────────── FILTER URL ────────────────
function setSelectValue(el, value) {
  if (!el || value == null || value === '') return;
  if ([...el.options].some(opt => opt.value === value)) el.value = value;
}

function serializeFilters() {
  const params = new URLSearchParams();
  const dateFrom = document.getElementById('f-date-from').value;
  const dateTo = document.getElementById('f-date-to').value;
  const county = document.getElementById('f-county').value;
  const municipality = document.getElementById('f-municipality').value;
  const listFilter = document.getElementById('f-list')?.value || '';
  const search = document.getElementById('f-search').value.trim();
  const beds = document.getElementById('f-beds').value;
  const price = document.getElementById('f-price').value;
  const availability = document.getElementById('f-available').value;
  const exactOnly = document.getElementById('f-coords')?.value === 'exact';
  const vei = document.getElementById('f-vei')?.value || '';
  const amenities = [...document.querySelectorAll('.amenity-chip.active')].map(el => el.dataset.amenity);

  if (dateFrom) params.set('fra', dateFrom);
  if (dateTo) params.set('til', dateTo);
  if (isWeekendFlexOn() && !dateFrom && !dateTo) params.set('helg', '12');
  if (county) params.set('fylke', county);
  if (municipality) params.set('kommune', municipality);
  if (listFilter) params.set('liste', listFilter);
  if (search) params.set('q', search);
  if (beds !== '') params.set('senger', beds);
  if (price !== '') params.set('pris', price);
  if (availability && availability !== 'available') params.set('ledige', availability);
  if (exactOnly) params.set('ca', '1');
  if (vei !== '') params.set('vei', vei);
  if (selectedAreaId) params.set('område', selectedAreaId);
  amenities.forEach(key => params.append('amenity', key));
  return params;
}

function replaceFilterUrl() {
  const query = serializeFilters().toString();
  const next = query
    ? `${location.pathname}?${query}${location.hash}`
    : `${location.pathname}${location.hash}`;
  history.replaceState(null, '', next);
}

function restoreFiltersFromUrl() {
  const params = new URLSearchParams(location.search);
  if (![...params.keys()].length) return;

  if (params.has('fra')) document.getElementById('f-date-from').value = params.get('fra');
  if (params.has('til')) document.getElementById('f-date-to').value = params.get('til');
  if (params.get('helg') === '12') setWeekendFlexOn(true);

  const countySel = document.getElementById('f-county');
  const fylke = params.get('fylke');
  const kommune = params.get('kommune');
  if (fylke) setSelectValue(countySel, fylke);
  if (fylke || kommune) updateMunicipalityFilter(countySel.value);
  if (kommune) setSelectValue(document.getElementById('f-municipality'), kommune);

  setSelectValue(document.getElementById('f-list'), params.get('liste'));
  const omrade = params.get('område');
  if (omrade && AREA_BY_ID[omrade]) selectedAreaId = omrade;
  if (params.has('q')) document.getElementById('f-search').value = params.get('q');
  if (params.has('senger')) document.getElementById('f-beds').value = params.get('senger');
  if (params.has('pris')) document.getElementById('f-price').value = params.get('pris');
  setSelectValue(document.getElementById('f-available'), params.get('ledige'));
  if (params.get('ca') === '1') {
    const coordsSelect = document.getElementById('f-coords');
    if (coordsSelect) coordsSelect.value = 'exact';
  }
  setSelectValue(document.getElementById('f-vei'), params.get('vei'));

  const wantedAmenities = new Set(params.getAll('amenity'));
  if (wantedAmenities.size) {
    document.querySelectorAll('.amenity-chip').forEach(chip => {
      if (wantedAmenities.has(chip.dataset.amenity)) chip.classList.add('active');
    });
  }
}

// ──────────────── FILTER ────────────────
function cabinInMapBounds(cabin, bounds) {
  if (!cabin.lat || !cabin.lng) return true;
  return bounds.contains(L.latLng(cabin.lat, cabin.lng));
}

function filterCabinsByForm() {
  const search = document.getElementById('f-search').value.toLowerCase().trim();
  const listFilter = document.getElementById('f-list')?.value || '';
  const minBeds = parseInt(document.getElementById('f-beds').value) || 0;
  const maxPrice = parseInt(document.getElementById('f-price').value) || Infinity;
  const county = document.getElementById('f-county').value;
  const municipality = document.getElementById('f-municipality').value;
  const availability = document.getElementById('f-available').value;
  const exactOnly = document.getElementById('f-coords')?.value === 'exact';
  const rareOnly = rarityReady && document.getElementById('f-rare')?.value === 'rare';
  const maxRoadKmRaw = document.getElementById('f-vei')?.value ?? '';
  const maxRoadKm = maxRoadKmRaw === '' ? null : Number(maxRoadKmRaw);
  const activeAmenities = [...document.querySelectorAll('.amenity-chip.active')].map(el => el.dataset.amenity);
  const selectedList = listFilter && listFilter !== 'any'
    ? cabinLists.find(list => list.url === listFilter)
    : null;

  return allCabins.filter(c => {
    // Date availability filter
    if (availableIds !== null && !availableIds.has(c.id)) return false;
    if (search) {
      const hay = `${c.name} ${c.description} ${c.stedsnavn || ''} ${c.municipalities.join(' ')} ${c.counties.join(' ')} ${c.provider}`.toLowerCase();
      if (!hay.includes(search)) return false;
    }
    if (listFilter === 'any' && !listsByCabinId[c.id]) return false;
    if (selectedList && !(selectedList.cabinIds || []).includes(c.id)) return false;
    if (minBeds && c.beds < minBeds) return false;
    if (maxPrice < Infinity && c.priceFrom > maxPrice) return false;
    if (county && !c.counties.includes(county)) return false;
    if (municipality && !c.municipalities.includes(municipality)) return false;
    if (selectedAreaId) {
      const area = AREA_BY_ID[selectedAreaId];
      if (area && !c.municipalities.some(m => area.municipalities.includes(m))) return false;
    }
    if (availability === 'available' && c.soldOut) return false;
    if (exactOnly && !isExactCabin(c)) return false;
    if (rareOnly && !isRareCabin(c.id)) return false;
    if (heartsFilterOn && !isHearted(c.id)) return false;
    if (maxRoadKm !== null && Number.isFinite(maxRoadKm)) {
      const dist = Number(c.summerDistanceKm);
      if (!Number.isFinite(dist) || dist > maxRoadKm) return false;
    }
    if (activeAmenities.length > 0 && !activeAmenities.every(a => (c.amenities || []).includes(a))) return false;
    return true;
  });
}

function filterCabinsByMapBounds(cabins) {
  if (!boundsFilterOn) return cabins;
  const bounds = map.getBounds();
  return cabins.filter(c => cabinInMapBounds(c, bounds));

async function applyFilters() {
  const dateFrom = document.getElementById('f-date-from').value;
  const dateTo = document.getElementById('f-date-to').value;
  const dateStatus = document.getElementById('date-status');

  // Specific fra/til wins over the flexible-weekend chip
  if (hasSpecificDateRange(dateFrom, dateTo)) {
    setWeekendFlexOn(false);
    dateStatus.style.display = 'block';
    dateStatus.className = 'loading';
    dateStatus.textContent = 'Sjekker ledighet mot iNatur...';
    try {
      availableIds = await fetchAvailableCabinIds(dateFrom, dateTo);
      dateStatus.className = '';
      dateStatus.textContent = `${availableIds.size} hytter ledige i valgt periode`;
      dateStatus.style.color = '#2c6e49';
    } catch (e) {
      dateStatus.className = '';
      dateStatus.textContent = `Feil ved sjekk av ledighet: ${e.message}`;
      dateStatus.style.color = '#c00';
      availableIds = null;
    }
  } else if (isWeekendFlexOn()) {
    dateStatus.style.display = 'block';
    dateStatus.className = 'loading';
    dateStatus.style.color = '#2c6e49';
    dateStatus.textContent = 'Sjekker 12 helger…';
    try {
      const { ids, succeeded } = await fetchFlexibleWeekendCabinIds();
      if (!succeeded) {
        setWeekendFlexOn(false);
        availableIds = null;
        dateStatus.className = '';
        dateStatus.textContent = 'Klarte ikke å sjekke helger';
        dateStatus.style.color = '#c00';
      } else {
        availableIds = ids;
        dateStatus.className = '';
        dateStatus.textContent = `${ids.size} hytter ledige en helg`;
        dateStatus.style.color = '#2c6e49';
      }
    } catch (e) {
      setWeekendFlexOn(false);
      availableIds = null;
      dateStatus.className = '';
      dateStatus.textContent = 'Klarte ikke å sjekke helger';
      dateStatus.style.color = '#c00';
    }
  } else {
    availableIds = null;
    dateStatus.style.display = dateFrom || dateTo ? 'block' : 'none';
    if ((dateFrom && !dateTo) || (!dateFrom && dateTo)) {
      dateStatus.textContent = 'Velg både fra- og til-dato';
      dateStatus.style.color = '#888';
    }
  }

  const formFiltered = filterCabinsByForm();
  showFilteredCabins(filterCabinsByMapBounds(formFiltered));
  syncListChips();
  syncAreaChips();
  syncMapToListFilter(formFiltered);
  replaceFilterUrl();
}

// ──────────────── LIST ────────────────
function sidebarPrice(cabin) {
  const price = Number(cabin.priceFrom);
  return Number.isFinite(price) && price > 0 ? price : Infinity;
}

function compareSidebarCabins(a, b) {
  const hearted = Number(isHearted(b.id)) - Number(isHearted(a.id));
  if (hearted) return hearted;
  const listed = Number(listsForCabin(b.id).length > 0) - Number(listsForCabin(a.id).length > 0);
  if (listed) return listed;
  const rare = Number(isRareCabin(b.id)) - Number(isRareCabin(a.id));
  if (rare) return rare;
  const sold = Number(!!a.soldOut) - Number(!!b.soldOut);
  if (sold) return sold;
  const price = sidebarPrice(a) - sidebarPrice(b);
  if (price) return price;
  return String(a.name || '').localeCompare(String(b.name || ''), 'no');
}

function updateList(cabins) {
  const el = document.getElementById('cabin-list');
  if (!cabins.length) {
    el.innerHTML = heartsFilterOn
      ? '<div class="no-results">Ingen lagrede hytter.</div>'
      : '<div class="no-results">Ingen hytter matcher filteret.</div>';
    return;
  }
  const ranked = cabins.slice().sort(compareSidebarCabins);
  const shown = ranked.slice(0, 200);
  const extra = ranked.length > 200 ? `<div class="no-results">Viser ${shown.length} av ${ranked.length}. Bruk filter for å begrense.</div>` : '';
  el.innerHTML = shown.map(c => {
    const onLists = listsForCabin(c.id);
    const rare = isRareCabin(c.id);
    const saved = isHearted(c.id);
    const listBadge = onLists.length
      ? `<span class="cabin-tag listed">${onLists.length === 1 ? 'På liste' : `På ${onLists.length} lister`}</span>`
      : '';
    const rareBadge = rare ? '<span class="cabin-tag rare">Sjelden ledig</span>' : '';
    const approxBadge = !isExactCabin(c)
      ? '<span class="cabin-tag approx">Uten nøyaktig kartpunkt</span>'
      : '';
    return `
    <div class="cabin-card${c.soldOut ? ' sold-out' : ''}" data-id="${c.id}" onclick="focusCabin('${c.id}')">
      <div class="cabin-card-head">
        <h3>${esc(c.name)}</h3>
        <button type="button" class="cabin-heart${saved ? ' saved' : ''}" data-heart-id="${c.id}" aria-label="${saved ? 'Fjern fra Mine hytter' : 'Lagre hytte'}" aria-pressed="${saved ? 'true' : 'false'}" onclick="event.stopPropagation(); toggleHeart('${c.id}')">${saved ? '♥' : '♡'}</button>
      </div>
      <div class="cabin-location">${esc(c.municipalities.join(', '))}${c.counties.length ? ' — ' + esc(c.counties.join(', ')) : ''}</div>
      <div class="cabin-meta">
        ${c.beds ? `<span class="cabin-tag beds">${c.beds} senger</span>` : ''}
        ${c.priceFrom ? `<span class="cabin-tag price">fra ${c.priceFrom} kr</span>` : ''}
        ${c.soldOut ? `<span class="cabin-tag sold">Opptatt</span>` : ''}
        ${approxBadge}
        ${rareBadge}
        ${listBadge}
      </div>
    </div>
  `;
  }).join('') + extra;
  restoreCabinCardHighlights();
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function cabinCardEl(id) {
  return document.querySelector(`.cabin-card[data-id="${id}"]`);
}

function pinElForCabin(id) {
  const marker = markerMap[id];
  if (!marker) return null;
  const el = marker.getElement();
  return el ? el.querySelector('.map-pin') : null;
}

function syncPinEmphasis(id) {
  const pin = pinElForCabin(id);
  const marker = markerMap[id];
  const on = !!(pin && (pin.classList.contains('hovered') || pin.classList.contains('selected')));
  if (pin) {
    const icon = pin.closest('.leaflet-marker-icon');
    if (icon) icon.classList.toggle('pin-emphasis', on);
  }
  if (marker) marker.setZIndexOffset(on ? 1000 : 0);
}

function setPinClass(id, className, on) {
  const pin = pinElForCabin(id);
  if (pin) pin.classList.toggle(className, on);
  syncPinEmphasis(id);
}

function restoreCabinCardHighlights() {
  if (hoveredCabinId) {
    const card = cabinCardEl(hoveredCabinId);
    if (card) card.classList.add('hovered');
  }
  if (selectedCabinId) {
    const card = cabinCardEl(selectedCabinId);
    if (card) card.classList.add('active');
  }
}

function restoreCabinPinHighlights() {
  if (hoveredCabinId) setPinClass(hoveredCabinId, 'hovered', true);
  if (selectedCabinId) setPinClass(selectedCabinId, 'selected', true);
}

function clearCabinHover() {
  const id = hoveredCabinId;
  hoveredCabinId = null;
  document.querySelectorAll('.cabin-card.hovered').forEach(el => el.classList.remove('hovered'));
  if (id) setPinClass(id, 'hovered', false);
}

function applyCabinHover(id, { scrollCard = false } = {}) {
  if (!id || isMobileViewport()) return;
  if (hoveredCabinId === id) return;
  clearCabinHover();
  hoveredCabinId = id;
  const card = cabinCardEl(id);
  if (card) {
    card.classList.add('hovered');
    if (scrollCard) card.scrollIntoView({ block: 'nearest' });
  }
  setPinClass(id, 'hovered', true);
}

function cabinPeekEl() {
  return document.getElementById('cabin-peek');
}

function hideCabinPeek() {
  const peek = cabinPeekEl();
  if (!peek) return;
  peek.classList.add('is-hidden');
  peek.hidden = true;
  peek.innerHTML = '';
  peek.style.bottom = '';
}

function syncCabinPeekPosition() {
  const peek = cabinPeekEl();
  if (!peek || peek.classList.contains('is-hidden')) return;
  const rail = document.getElementById('weekend-rail');
  const railH = rail && !rail.classList.contains('is-hidden') ? rail.offsetHeight : 0;
  peek.style.bottom = railH ? `${railH + 8}px` : '';
}

function showCabinPeek(id) {
  const peek = cabinPeekEl();
  if (!peek || !isMobileViewport() || !document.body.classList.contains('mobile-view-map')) {
    hideCabinPeek();
    return;
  }
  const cabin = allCabins.find(c => c.id === id);
  if (!cabin) {
    hideCabinPeek();
    return;
  }
  const imgHtml = cabin.image
    ? `<img class="cabin-peek-img" src="${cabin.image}/w=300,h=180,fit=cover,format=auto" alt="" onerror="this.style.display='none'" />`
    : '';
  const kommune = (cabin.municipalities || []).join(', ');
  peek.innerHTML = `
    ${imgHtml}
    <div class="cabin-peek-body">
      <div class="cabin-peek-name">${esc(cabin.name)}</div>
      ${kommune ? `<div class="cabin-peek-kommune">${esc(kommune)}</div>` : ''}
      <a class="popup-link" href="${esc(cabin.url)}" target="_blank" rel="noopener">Se på iNatur</a>
    </div>
  `;
  peek.classList.remove('is-hidden');
  peek.hidden = false;
  requestAnimationFrame(syncCabinPeekPosition);
}

function syncCabinPeek() {
  if (isMobileViewport() && selectedCabinId && document.body.classList.contains('mobile-view-map')) {
    showCabinPeek(selectedCabinId);
    return;
  }
  hideCabinPeek();
}

function cabinIdFromPopup(popup) {
  return popup && popup._source && popup._source._cabinId ? popup._source._cabinId : null;
}

function setupCabinHoverSync() {
  const list = document.getElementById('cabin-list');
  if (!list) return;
  list.addEventListener('pointerover', e => {
    if (isMobileViewport()) return;
    const card = e.target.closest('.cabin-card');
    if (!card || !list.contains(card)) return;
    applyCabinHover(card.dataset.id);
  });
  list.addEventListener('pointerout', e => {
    if (isMobileViewport()) return;
    const card = e.target.closest('.cabin-card');
    if (!card) return;
    const next = e.relatedTarget;
    if (next && card.contains(next)) return;
    if (hoveredCabinId === card.dataset.id) clearCabinHover();
  });
}

function setupCabinPeek() {
  map.on('popupopen', e => {
    const id = cabinIdFromPopup(e.popup);
    if (!id) return;
    if (selectedCabinId && selectedCabinId !== id) setPinClass(selectedCabinId, 'selected', false);
    selectedCabinId = id;
    setPinClass(id, 'selected', true);
    if (isMobileViewport()) showCabinPeek(id);
  });
  map.on('popupclose', e => {
    const id = cabinIdFromPopup(e.popup);
    if (id) setPinClass(id, 'selected', false);
    if (selectedCabinId === id) selectedCabinId = null;
    hideCabinPeek();
  });
  const rail = document.getElementById('weekend-rail');
  if (rail && typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(() => syncCabinPeekPosition()).observe(rail);
  }
}

// ──────────────── MAP ────────────────
function listedHomeLatLng(marker) {
  return marker._homeLatLng || marker.getLatLng();
}

function unspiderfyListed() {
  if (!listedSpiderfy) return;
  listedSpiderfy.markers.forEach(({ marker, home }) => marker.setLatLng(home));
  listedSpiderfy = null;
}

function spiderfyListedIfNeeded(clicked) {
  const clickedHome = listedHomeLatLng(clicked);
  const originPt = map.latLngToLayerPoint(clickedHome);
  const members = [];
  listedLayer.eachLayer(m => {
    const pt = map.latLngToLayerPoint(listedHomeLatLng(m));
    if (originPt.distanceTo(pt) <= LISTED_SPIDERFY_PX) members.push(m);
  });
  if (members.length < 2) {
    unspiderfyListed();
    return;
  }
  const sameGroup = listedSpiderfy
    && listedSpiderfy.markers.length === members.length
    && members.every(m => listedSpiderfy.markers.some(entry => entry.marker === m));
  if (sameGroup) return;

  unspiderfyListed();
  listedSpiderfy = {
    markers: members.map(marker => ({ marker, home: listedHomeLatLng(marker) })),
  };
  members.forEach((m, i) => {
    const angle = (2 * Math.PI * i) / members.length - Math.PI / 2;
    m.setLatLng(map.layerPointToLatLng(L.point(
      originPt.x + Math.cos(angle) * LISTED_SPIDERFY_RADIUS,
      originPt.y + Math.sin(angle) * LISTED_SPIDERFY_RADIUS
    )));
  });
}

function countCabinsWithCoords(cabins) {
  return cabins.reduce((n, c) => n + (c.lat && c.lng ? 1 : 0), 0);
}

function shouldShowPinPrices(cabins) {
  return map.getZoom() >= PIN_PRICE_ZOOM || countCabinsWithCoords(cabins) <= PIN_PRICE_MAX_CABINS;
}

function formatPinPrice(cabin) {
  const price = Number(cabin.priceFrom);
  if (!Number.isFinite(price) || price <= 0) return '';
  return `${Math.round(price)} kr`;
}

function cabinPinIcon(c, showPrice) {
  const listed = listsForCabin(c.id).length > 0;
  const rare = isRareCabin(c.id);
  const approx = isApproxCabin(c);
  const hearted = isHearted(c.id);
  const priceText = showPrice ? formatPinPrice(c) : '';
  const pinClasses = [
    'map-pin',
    listed ? 'listed' : '',
    rare ? 'rare' : '',
    approx ? 'approx' : '',
    approx && c.soldOut ? 'sold' : '',
  ].filter(Boolean).join(' ');
  const pinStyle = approx ? '' : ` style="background:${c.soldOut ? '#c0392b' : '#2c6e49'}"`;
  const approxMark = approx ? '<span class="map-pin-approx-mark">ca.</span>' : '';
  const starMark = listed ? '<span class="map-pin-badge">★</span>' : '';
  const heartMark = hearted ? '<span class="map-pin-heart-badge">♥</span>' : '';
  const rareMark = rare ? '<span class="map-pin-rare-badge">Sjelden ledig</span>' : '';
  const priceMark = priceText ? `<span class="map-pin-price">${esc(priceText)}</span>` : '';
  const iconSize = approx ? [22, 28] : ((listed || rare || hearted || priceText) ? [18, 18] : [12, 12]);
  const iconAnchor = approx ? [11, 8] : [iconSize[0] / 2, iconSize[1] / 2];
  return L.divIcon({
    className: (approx || hearted || priceText) ? 'cabin-div-icon' : '',
    html: `<div class="${pinClasses}"${pinStyle}>${approxMark}${starMark}${heartMark}${rareMark}${priceMark}</div>`,
    iconSize,
    iconAnchor,
  });
}

function cabinPopupHtml(c) {
  const onLists = listsForCabin(c.id);
  const listed = onLists.length > 0;
  const rare = isRareCabin(c.id);
  const stats = rarityForCabin(c.id);
  const saved = isHearted(c.id);
  const amenityHtml = (c.amenities || []).slice(0, 8).map(a =>
    `<span class="popup-amenity">${AMENITY_LABELS[a] || a}</span>`
  ).join('');
  const imgHtml = c.image ? `<img class="popup-img" src="${c.image}/w=300,h=180,fit=cover,format=auto" onerror="this.style.display='none'" />` : '';
  const approxLead = approxPopupLead(c);
  const approxHtml = approxLead ? `<div class="popup-approx-note">${esc(approxLead)}</div>` : '';
  return `
        ${approxHtml}
        ${imgHtml}
        <div class="popup-title">${esc(c.name)}</div>
        ${c.description ? `<div class="popup-desc">${esc(c.description)}</div>` : ''}
        ${c.beds ? `<div class="popup-meta">Senger: ${c.beds}</div>` : ''}
        ${c.priceFrom ? `<div class="popup-meta">Fra ${c.priceFrom} kr/natt</div>` : ''}
        <div class="popup-meta">${esc(c.municipalities.join(', '))} — ${esc(c.counties.join(', '))}</div>
        ${c.provider ? `<div class="popup-meta" style="color:#888;font-size:.75rem">Tilbyder: ${esc(c.provider)}</div>` : ''}
        ${rare ? `<div class="popup-meta">Opptatt i ${stats.soldOutCount} av ${stats.snapshotCount} ukentlige sjekk</div>` : ''}
        ${listed ? `<div class="popup-lists"><div class="popup-lists-label">På iNatur-lister</div><ul>${onLists.map(list => `<li>${esc(list.title)}</li>`).join('')}</ul></div>` : ''}
        ${amenityHtml ? `<div class="popup-amenities">${amenityHtml}</div>` : ''}
        <div class="popup-actions">
          <a class="popup-link" href="${c.url}" target="_blank" rel="noopener">Se på iNatur</a>
          <button type="button" class="popup-heart${saved ? ' saved' : ''}" data-heart-id="${c.id}" aria-pressed="${saved ? 'true' : 'false'}" onclick="event.stopPropagation(); toggleHeart('${c.id}')">${saved ? 'Lagret' : 'Lagre'}</button>
        </div>
      `;
}

function updateMap(cabins) {
  lastMappedCabins = cabins;
  pinPricesShown = shouldShowPinPrices(cabins);
  unspiderfyListed();
  clusterGroup.clearLayers();
  listedLayer.clearLayers();
  markerMap = {};

  cabins.forEach(c => {
    if (!c.lat || !c.lng) return;

    const listed = listsForCabin(c.id).length > 0;

    const m = L.marker([c.lat, c.lng], {
      icon: cabinPinIcon(c, pinPricesShown),
      pane: listed ? 'listedPane' : 'markerPane',
      riseOnHover: listed,
    }).bindPopup(cabinPopupHtml(c), { maxWidth: 300 });
    m._cabinId = c.id;
    m.on('mouseover', () => applyCabinHover(c.id, { scrollCard: true }));
    m.on('mouseout', () => {
      if (hoveredCabinId === c.id) clearCabinHover();
    });

    if (listed) {
      m._homeLatLng = L.latLng(c.lat, c.lng);
      m.on('click', () => spiderfyListedIfNeeded(m));
      listedLayer.addLayer(m);
    } else {
      clusterGroup.addLayer(m);
    }
    markerMap[c.id] = m;
  });
  restoreCabinPinHighlights();
}

map.on('zoomstart', unspiderfyListed);

function focusCabin(id) {
  document.querySelectorAll('.cabin-card').forEach(el => el.classList.remove('active'));
  const card = document.querySelector(`.cabin-card[data-id="${id}"]`);
  if (card) { card.classList.add('active'); card.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }

  const m = markerMap[id];
  if (m) {
    const openMarker = () => {
      if (listedLayer.hasLayer(m)) {
        spiderfyListedIfNeeded(m);
        map.panTo(m.getLatLng());
        m.openPopup();
        return;
      }
      clusterGroup.zoomToShowLayer(m, () => {
        m.openPopup();
      });
    };

    if (isMobileViewport()) {
      setMobileView('map');
      setTimeout(openMarker, 140);
      return;
    }

    openMarker();
  }
}

// ──────────────── EVENTS ────────────────
document.getElementById('btn-filter').addEventListener('click', applyFilters);
document.getElementById('f-search').addEventListener('keydown', e => { if (e.key === 'Enter') applyFilters(); });

  document.getElementById('f-price').value = '';
  document.getElementById('f-county').value = '';

  if (rareSelect) rareSelect.value = '';

  if (veiSelect) veiSelect.value = '';
  document.getElementById('date-status').style.display = 'none';

});
